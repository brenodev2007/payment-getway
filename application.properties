spring.application.name=payment-getway
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/payment_gateway?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cocinfo018}
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

webhook.outbox.polling-interval=5000
webhook.outbox.batch-size=50
webhook.outbox.max-attempts=10
webhook.outbox.initial-delay=30
webhook.outbox.max-delay=3600
webhook.outbox.recovery-interval=60000

security.jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentAndTestingPurposes32BytesLong}
security.jwt.expiration=3600